<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grammify - AI Grammar Tutor & Writing Coach</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-container">
          <svg class="logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <!-- G shape background -->
            <circle cx="24" cy="24" r="22" fill="none" stroke="#2563eb" stroke-width="2"/>
            <!-- G lettermark -->
            <path d="M 32 14 Q 36 18 36 24 Q 36 32 28 35 L 28 27 L 24 27" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Checkmark accent -->
            <path d="M 16 24 L 19 27 L 23 20" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="logo-text">Grammify</span>
        </div>
      </div>
      <div class="chat-history" id="chat-history">
        <div class="empty-state">
          <span>Start a new conversation</span>
          <p>Your recent sessions will appear here.</p>
        </div>
      </div>
      <div class="rate-us-panel">
        <div class="rate-us-title">Rate us</div>
        <div class="rate-us-stars" id="rate-us-stars">
          <button type="button" class="rate-star" data-rating="1">★</button>
          <button type="button" class="rate-star" data-rating="2">★</button>
          <button type="button" class="rate-star" data-rating="3">★</button>
          <button type="button" class="rate-star" data-rating="4">★</button>
          <button type="button" class="rate-star" data-rating="5">★</button>
        </div>
      </div>
    </aside>

    <main class="chat-panel">
      <header class="chat-header">
        <div>
          <h1>Grammify</h1>
          <p>Your AI Grammar Tutor & Writing Coach</p>
        </div>
      </header>

      <section class="chat-window" id="chat-window"></section>
    </main>
  </div>



  <div class="composer">
    <div class="composer-inner">
      <div class="composer-actions">
        <button id="mic-button" type="button" class="composer-action">🎤</button>
        <button id="camera-button" type="button" class="composer-action">📸</button>
        <button id="upload-button" type="button" class="composer-action">📎</button>
      </div>
      <label class="sr-only" for="user-input">Message</label>
      <input id="user-input" type="text" placeholder="Type a message..." autocomplete="off" />
      <button id="send-button" type="button">Send</button>
      <input id="attach-input" type="file" accept="image/*,video/*,audio/*" hidden />
    </div>
  </div>

  <button id="scroll-button" type="button" class="scroll-button">Scroll to latest</button>

  <div class="camera-panel" id="camera-panel" aria-hidden="true">
    <div class="camera-card">
      <div class="camera-header">
        <h2>Camera</h2>
        <button id="close-camera" type="button">✕</button>
      </div>
      <video id="camera-video" autoplay muted playsinline></video>
      <div class="camera-actions">
        <button id="capture-button" type="button">Capture photo</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
